# SPDX-License-Identifier: Apache-2.0
name: CI

# The actions in actions/ are used by the workflows of the other repositories, pinned by
# commit. Every push to a branch runs their tests and lints the scripts and this workflow;
# main takes squash-merged pull requests only, so nothing runs after the merge.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions:
    name: Actions (tests, shellcheck, actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests
        run: |
          set -euo pipefail
          for tests in actions/*/test.sh; do
            echo "::group::$tests"
            bash "$tests"
            echo "::endgroup::"
          done
      - name: shellcheck
        run: shellcheck actions/*/*.sh
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
